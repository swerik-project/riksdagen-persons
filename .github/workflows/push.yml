name: "Riksdagen Persons: data integrity tests"

on:
  pull_request:
    branches:
      - 'dev'
  push:
    paths:
      - data/**
      - .github/**
  workflow_dispatch:

jobs:
  chairs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/checkout
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen
        pip install pyriksdagen==1.10.0
        pip install pytest-cfg-fetcher
        pip install pandas==2.3.3
        pip install polars pyarrow
    - name: Test chars and chair-mp mapping metadata
      run: |
        python -m unittest test.chairs

  csvw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/checkout
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install csvw
        pip install pyriksdagen
        pip install pyriksdagen==1.10.0
        pip install pytest-cfg-fetcher
        pip install pandas==2.3.3
        pip install polars
        pip install pyarrow
    - name: Test that metadata matchs CSVW spec
      run: |
        python -m unittest test.csvw_metadata
    - name: Test that metadata is properly sorted
      run: |
        python -m unittest test.sort_order

  db:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/checkout
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen
        pip install pytest-cfg-fetcher
    - name: Test metadata integrity
      run: |
        echo "Test that there are no duplicates in the DB"
        echo "throw ERROR on inconsistencies on our side"
        echo "WARN on upstream errors"
        python -m unittest test.db
        python -m unittest test.person_id_integrity
        python -m unittest test.minister_date_integrity

  mandates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/checkout
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen
        pip install pytest-cfg-fetcher
    - name: Test manually curated mandate dates do not change
      run: |
        python -m unittest test.mandates

  partyAffiliation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
       python-version: [3.8]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/checkout
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen
        pip install pytest-cfg-fetcher
    - name: Test MPs agains manually curated data
      run: |
        python -m unittest test.party-affiliation
        python -m unittest test.party-name

  frequency-distr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/checkout
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyriksdagen
        pip install pytest-cfg-fetcher
    - name: Test at least 95% of parliament days have the correct N MPs (+-10%)
      run: |
        python -m unittest test.mp-frequency-test

  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/checkout
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install csvw
        pip install pyriksdagen
        pip install pytest-cfg-fetcher
        pip install pdoc
        pip install polars
    - name: Test documentation build
      run: |
        pdoc -o /tmp/riksdagen-persons-docs --footer-text docs-smoke-test -t docs/dark-mode --logo https://raw.githubusercontent.com/swerik-project/the-swedish-parliament-corpus/refs/heads/main/readme/riksdagshuset.jpg ../riksdagen-persons
